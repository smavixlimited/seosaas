services:
  skorvia:
    build:
      context: .
      dockerfile: Dockerfile.selfhost
    image: skorvia:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CLOUDFLARE_INCLUDE_PROCESS_ENV=true
      - PORT=${PORT:-3001}
      - ALLOWED_HOST=${ALLOWED_HOST:-}
      - AUTH_MODE=${AUTH_MODE:-hosted}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3001}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-skorvia_production_super_secret_auth_token_2026_xyz}
      - BYPASS_EMAIL_VERIFICATION=${BYPASS_EMAIL_VERIFICATION:-true}
      - DATAFORSEO_API_KEY=${DATAFORSEO_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - DATABASE_PROVIDER=${DATABASE_PROVIDER:-d1}
      - POSTGRES_DATABASE_URL=${POSTGRES_DATABASE_URL:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - VITE_SHOW_DEVTOOLS=false
    ports:
      - "0.0.0.0:${PORT:-3001}:${PORT:-3001}"
    volumes:
      - skorvia_data:/app/.wrangler
volumes:
  skorvia_data:
